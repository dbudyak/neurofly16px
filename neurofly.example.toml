# Copy to neurofly.toml (git-ignored) and edit. `neurofly run` picks it up from
# the working directory, or from ~/.config/neurofly16px/neurofly.toml.

[stages]
# What `neurofly run` uses when the matching flag is absent.
audio = "mic"          # stub | mic | pipewire | portaudio
behavior = "fsm"       # scripted | fsm
sim = "flybody"        # stub | flybody
device = "ditoo"       # terminal | ppm | ditoo

[loop]
fps = 16               # measured smooth on the Ditoo
behavior_hz = 50

[render]
view = "side"          # side | top
arena_cm = 8.0         # world width mapped across the 16 columns
height_cm = 2.0        # world height mapped across the 16 rows
show_ground = true

[ditoo]
mac = "XX:XX:XX:XX:XX:XX"
channel = 0            # 0 = resolve the serial-port channel from SDP
image_cmd = "44"
brightness = 60
settle_s = 1.5

[audio]
# `pactl list short sources`; empty means the PipeWire default source.
device = ""
samplerate = 16000
block_ms = 20
channels = 2

[fsm]
t_walk = 0.15          # loudness that starts her walking
t_idle = 0.08          # below this for idle_dwell_s and she stops
t_startle = 0.45       # a transient this loud makes her hop
startle_cooldown_s = 3.0

[flybody]
policy_path = "data/policy_walking.npz"
v_max_cm_s = 2.0
w_max_rad_s = 2.0

[night]
enabled = true
start = 23.0           # local hour the panel goes dark (the window may wrap midnight)
end = 7.0
brightness = 0
day_brightness = 60    # restored in the morning; keep in step with ditoo.brightness

[wander]
# What she does when no audio arrives at all (no mic, or it died).
forward = 0.5
turn_amount = 0.35

[brain]
# Phase 6: --behavior brain. Needs data/banc_v888.npz and data/populations.json
# (scripts/fetch_banc.sh, scripts/build_anatomy.py, scripts/build_connectome.py).
device = "cuda"
viewer = true          # http://127.0.0.1:8765 while the brain runs
viewer_port = 8765
window_ms = 20.0
giant_fibre_hz = 60.0  # escape threshold on DNp01
drive_hz = 2.0         # mean descending rate that means "full speed"
